version: '3.8'

services:
  # Primary Database
  db:
    image: postgres:16-alpine
    container_name: bi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_bi_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: bi_redis
    restart: always
    ports:
      - "6379:6379"

  # FastAPI Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/ai_bi_assistant
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=enterprise-super-secret-key-2026-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Celery Background Task Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bi_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/ai_bi_assistant
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=enterprise-super-secret-key-2026-production
    depends_on:
      - backend
      - redis


  # React Enterprise Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bi_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
